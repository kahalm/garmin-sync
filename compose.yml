# Garmin-Daten → SQLite. Start: docker compose up -d
# Erstanmeldung (nur auf einem frischen Volume): docker compose run --rm garmin auth
services:
  garmin:
    build: .
    image: garmin-sync:local
    container_name: garmin-sync
    init: true
    user: "1000:1000"
    restart: unless-stopped
    environment:
      TZ: Europe/Vienna
      GARMIN_START: "2017-01-01"  # ab hier holt der erste Start die Historie
      SYNC_TIME: "05:40"          # täglicher Abgleich
      REFRESH_SECONDS: "300"      # so oft prüfen, ob die Uhr neu hochgeladen hat (0 = aus)
      PUSH_NEXT_WORKOUT: "1"      # nächste 5x5-Einheit als Workout auf die Uhr (schreibt ins Garmin-Konto)
      TRAINING_BLOCKED_WEEKDAYS: "2,4"  # an diesen Tagen kein Termin (0 = Mo … 6 = So; hier Mi + Fr)
    volumes:
      # Datenbanken, Rohdateien, Tokens und Logs — alles, was überleben muss.
      - ./data:/data
    labels:
      # Lokal gebautes Image: Watchtower fände es in keiner Registry.
      - com.centurylinklabs.watchtower.enable=false
    logging:
      options:
        max-size: "5m"
        max-file: "2"

  # MCP-Server für Claude (Browser, Desktop, Handy): lesender Zugriff auf die Datenbanken.
  # Startet nur mit COMPOSE_PROFILES=mcp und einem MCP_PATH_SECRET in .env. Claude verbindet
  # sich aus Anthropics Rechenzentrum — davor gehört ein Reverse-Proxy mit TLS, der nur
  # Anthropics Adressbereich durchlässt (siehe mcp_server.py).
  mcp:
    image: garmin-sync:local
    container_name: garmin-mcp
    profiles: ["mcp"]
    command: ["mcp"]
    init: true
    user: "1000:1000"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      TZ: Europe/Vienna
      MCP_PATH_SECRET: ${MCP_PATH_SECRET:-}      # Adresse wird https://<host>/<Geheimnis>/mcp
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}  # Hostname, unter dem der Proxy ihn anspricht
    volumes:
      - ./data:/data:ro
    tmpfs:
      - /data/.garminconnect  # verdeckt die Garmin-Tokens vor diesem Container
      - /data/.mfp            # ebenso die MyFitnessPal-Cookies
      - /tmp
    ports:
      - "127.0.0.1:8103:8000"
    labels:
      - com.centurylinklabs.watchtower.enable=false
    logging:
      options:
        max-size: "5m"
        max-file: "2"

  # Knopf „nächste Einheit heute machen“ (für Grafana). Braucht Schreibzugriff und die
  # Garmin-Tokens, nutzt aber dasselbe Lock wie der Abgleich. Nur über den Reverse-Proxy
  # der Grafana-Seite erreichbar (kein Host-Port).
  button:
    image: garmin-sync:local
    container_name: garmin-workout-button
    command: ["button"]
    init: true
    user: "1000:1000"
    restart: unless-stopped
    environment:
      TZ: Europe/Vienna
      TRAINING_BLOCKED_WEEKDAYS: "2,4"
    volumes:
      - ./data:/data
    labels:
      - com.centurylinklabs.watchtower.enable=false
    logging:
      options:
        max-size: "5m"
        max-file: "2"
